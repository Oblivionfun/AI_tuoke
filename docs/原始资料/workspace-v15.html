    function drawSettings(){$('#main').innerHTML=shell('系统设置','SETTINGS · WORKSPACE CONTROL')+`<div class="settings-grid"><section class="setting-card"><h3>团队与权限</h3><p>配置管理员、销售、报价工程师和只读成员。每个角色只看到对应的数据范围。</p><span class="status-ok">● 4 名成员已启用</span><div style="margin-top:14px"><button class="btn light" onclick="toast('成员管理将在下一步接入')">管理成员</button></div></section><section class="setting-card"><h3>数据连接</h3><p>官网询价表单、企业邮箱、文件存储和 AI 规格提取服务。</p><span class="status-ok">● 官网询价表单已连接</span><div style="margin-top:14px"><button class="btn light" onclick="toast('邮箱 OAuth 配置将在下一步接入')">配置连接</button></div></section><section class="setting-card"><h3>报价规则</h3><p>设置目标毛利、报价有效期、默认付款方式和低毛利审批条件。</p><span class="status-ok">● 默认毛利率 18%</span><div style="margin-top:14px"><button class="btn light" onclick="openQuoteModal()">查看规则</button></div></section><section class="setting-card"><h3>数据与审计</h3><p>查看导入记录、操作日志、退订名单和数据备份状态。</p><span class="status-ok">● 最近备份：今天 06:00</span><div style="margin-top:14px"><button class="btn light" onclick="toast('审计日志将在下一步接入')">查看日志</button></div></section></div>`;bindCommon()}
    function bindCommon(){$$('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.module));const g=$('#globalSearch');if(g)g.onkeydown=e=>{if(e.key==='Enter'){state.leadFilters={q:g.value};navigate('leads')}}}
    function openLead(id){const l=leads.find(x=>x.id===id)||leads[0];$('#drawer').innerHTML=`<button class="close" onclick="closeDrawer()">×</button><div class="eyebrow">LEAD PROFILE · ${l.id}</div><h2>${l.company}</h2><div class="drawer-sub">${l.person} · ${l.country} · ${l.tz}</div><div class="score-box"><div class="score-ring">${l.score}</div><div><strong>${l.score>=80?'A 类高意向客户':l.score>=60?'B 类培育客户':'C 类长期跟进'}</strong><small>产品匹配度高 · ${l.stage}</small></div></div><div class="detail-grid"><div class="detail"><label>邮箱</label><strong>${l.email}</strong></div><div class="detail"><label>电话</label><strong>${l.phone}</strong></div><div class="detail"><label>需求产品</label><strong>${l.product}</strong></div><div class="detail"><label>预计金额</label><strong>${l.amount}</strong></div><div class="detail"><label>负责人</label><strong>${l.owner}</strong></div><div class="detail"><label>下次跟进</label><strong>${l.next}</strong></div></div><div class="section-line"><h3>最近沟通</h3><div class="note">“Thanks for the quotation. Could you please confirm the zinc thickness and send the packing photos?”</div></div><div class="section-line"><h3>客户时间线</h3><div class="timeline"><div class="event"><i></i><div><b>客户回复报价</b><small>今天 08:42 · RFQ-1048</small></div></div><div class="event"><i></i><div><b>报价版本 Q-2026-010 已生成</b><small>昨天 16:20 · 王颖</small></div></div><div class="event"><i></i><div><b>发送开发信</b><small>10 月 6 日 · 邮件开发</small></div></div><div class="event"><i></i><div><b>客户创建</b><small>10 月 6 日 · 官网导入</small></div></div></div></div><div class="section-line"><h3>下一步建议</h3><div class="note" style="border-color:var(--mint);background:var(--mint-soft)">${l.next} 前回复规格确认，并附上包装照片。回复后推进至样品确认。</div></div><div class="drawer-actions"><button class="btn primary" onclick="toast('邮件编辑器将在下一步打开')">发送邮件</button><button class="btn light" onclick="openQuoteModal();closeDrawer()">打开报价单</button><button class="btn light" onclick="toast('已安排跟进提醒')">安排跟进</button></div>`;$('#drawer').classList.add('open');$('#drawerBg').classList.add('open')}
    function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBg').classList.remove('open')}
    function openLeadModal(){openModal('新增一条线索',`<form id="leadForm"><div class="modal-grid"><div class="field"><label>公司名称 *</label><input name="company" required placeholder="Global Fasteners LLC"/></div><div class="field"><label>联系人</label><input name="person" placeholder="姓名 / 职位"/></div><div class="field"><label>邮箱</label><input name="email" type="email" placeholder="buyer@company.com"/></div><div class="field"><label>国家 / 地区</label><input name="country" placeholder="例如：波兰"/></div><div class="field"><label>需求产品</label><input name="product" placeholder="DIN 933 M12"/></div><div class="field"><label>来源</label><select name="source"><option>官网表单</option><option>邮件开发</option><option>Google SEO</option><option>展会名片</option><option>人工录入</option></select></div><div class="field full"><label>备注</label><textarea name="note" placeholder="数量、交期、目的港或其他需求"></textarea></div></div><div class="modal-foot"><button type="button" class="btn light" onclick="closeModal()">取消</button><button class="btn primary">保存线索</button></div></form>`);$('#leadForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));await mockApi.createLead(data);closeModal();toast(data.company+' 已加入线索中心');if(state.module==='leads')navigate('leads')}}
    function openRFQ(id){const r=rfqs.find(x=>x.id===id)||rfqs[0];openModal(r.id+' · 询盘详情',`<div class="detail-grid"><div class="detail"><label>公司</label><strong>${r.company}</strong></div><div class="detail"><label>状态</label><strong>${r.status}</strong></div><div class="detail"><label>产品</label><strong>${r.product}</strong></div><div class="detail"><label>规格</label><strong>${r.spec}</strong></div><div class="detail"><label>数量</label><strong>${r.qty}</strong></div><div class="detail"><label>目的港</label><strong>${r.port}</strong></div></div><div class="section-line"><h3>AI 提取字段</h3><div class="note" style="border-color:var(--mint);background:var(--mint-soft)">已识别：标准、尺寸、强度等级、表面处理、数量。缺少：包装要求、目标交期。</div></div><div class="section-line"><h3>原始询盘</h3><div class="note">Please quote the above specification with packing photos and confirm zinc thickness. We need delivery within 30 days.</div></div><div class="drawer-actions"><button class="btn primary" onclick="closeModal();openQuoteModal('${r.product}')">创建报价</button><button class="btn light" onclick="toast('已标记为待补充信息')">请求补充信息</button></div>`)}
    function openQuoteModal(product='DIN 933 M12 × 60'){openModal('创建报价草稿',`<form id="quoteForm"><div class="modal-grid"><div class="field"><label>客户</label><input name="company" value="Alpine Fixings GmbH"/></div><div class="field"><label>产品</label><input name="product" value="${product}"/></div><div class="field"><label>数量</label><input name="qty" value="20,000 pcs"/></div><div class="field"><label>单价 USD</label><input name="price" value="0.42"/></div><div class="field"><label>贸易条款</label><select name="incoterm"><option>FOB Tianjin</option><option>CIF Hamburg</option><option>CFR Jebel Ali</option><option>EXW Factory</option></select></div><div class="field"><label>报价有效期</label><select name="validity"><option>15 天</option><option>30 天</option><option>45 天</option></select></div><div class="field"><label>交期</label><input name="lead" value="25 天"/></div><div class="field"><label>目标毛利率</label><input name="margin" value="18%"/></div><div class="field full"><label>备注</label><textarea name="note" placeholder="包装、付款方式、检测资料和其他条款"></textarea></div></div><div class="modal-foot"><button type="button" class="btn light" onclick="closeModal()">取消</button><button type="button" class="btn light" onclick="toast('PDF 生成已准备（演示）')">生成 PDF</button><button class="btn primary">保存报价草稿</button></div></form>`);$('#quoteForm').onsubmit=async e=>{e.preventDefault();await mockApi.createQuote(Object.fromEntries(new FormData(e.target)));closeModal();toast('报价草稿 Q-2026-011 已保存')}}
    function openTaskModal(id){const t=tasks.find(x=>x.id===id)||{};openModal(id?'编辑跟进任务':'新增跟进任务',`<form id="taskForm"><div class="modal-grid"><div class="field full"><label>任务标题 *</label><input name="title" required value="${t.title||''}" placeholder="例如：确认客户包装要求"/></div><div class="field"><label>客户</label><input name="company" value="${t.company||''}" placeholder="公司名称"/></div><div class="field"><label>负责人</label><select name="owner"><option ${t.owner==='王颖'?'selected':''}>王颖</option><option ${t.owner==='李明'?'selected':''}>李明</option><option ${t.owner==='陈涛'?'selected':''}>陈涛</option></select></div><div class="field"><label>优先级</label><select name="priority"><option>高</option><option>中</option><option>低</option></select></div><div class="field"><label>截止时间</label><input name="due" value="${t.due||''}" placeholder="今天 16:00"/></div></div><div class="modal-foot"><button type="button" class="btn light" onclick="closeModal()">取消</button><button class="btn primary">保存任务</button></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();closeModal();toast('跟进任务已保存')}}
    function openModal(title,body){$('#modalBg').innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div>`;$('#modalBg').classList.add('open')}
    function closeModal(){$('#modalBg').classList.remove('open')}
    async function completeTask(id,el){const t=await mockApi.updateTask(id,el.checked?'已完成':'待处理');el.closest('.task')?.classList.toggle('done',el.checked);toast(t?.status==='已完成'?'任务已完成':'任务已恢复');if(state.module==='tasks'&&state.taskView==='list')navigate('tasks')}
    function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
    $('#drawerBg').onclick=closeDrawer;$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
    function setupResearchNav(){if($('#nav [data-module="research"]'))return;const b=document.createElement('button');b.dataset.module='research';b.innerHTML='<span class="nav-icon">⌁</span>客户研究';$('#nav').appendChild(b)}
    function drawResearch(){const items=[{id:'RS-001',channel:'TikTok',type:'公开评论',author:'@metalbuildpro',region:'阿联酋',text:'Looking for a reliable anchor bolt supplier for a new warehouse project. Any factory recommendations?',signals:['采购意向','地脚螺栓','项目采购'],intent:86,status:'待审核',url:'https://www.tiktok.com/'},{id:'RS-002',channel:'LinkedIn',type:'公司动态',author:'Gulf Build Materials',region:'阿联酋',text:'We are expanding our supplier network for structural and solar mounting components in 2026.',signals:['供应商开发','光伏配件','工程采购'],intent:78,status:'已保存',url:'https://www.linkedin.com/'},{id:'RS-003',channel:'WhatsApp',type:'已授权对话',author:'Nordic Rail Supply',region:'挪威',text:'Could you share your latest catalogue and lead time for custom rail connectors?',signals:['已授权','目录需求','非标件'],intent:91,status:'待跟进',url:'https://business.whatsapp.com/'}];const colors={TikTok:'var(--ink)',LinkedIn:'var(--blue)',WhatsApp:'var(--mint)'};$('#main').innerHTML=shell('客户研究中心','PUBLIC SIGNALS · CHANNEL RESEARCH')+`<section class="panel" style="margin-bottom:13px"><div class="panel-head"><div><div class="panel-title">从公开信号找到可跟进的客户</div><div class="panel-note">只处理公开内容、授权会话或官方 API 返回的数据。个人资料不会被批量抓取。</div></div><button class="btn light" onclick="toast('研究规则已打开')">研究规则</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 17px"><div style="background:#f1eee7;border-radius:11px;padding:13px"><b style="font-size:11px">TikTok</b><span style="display:block;color:var(--muted);font-size:9px;margin-top:6px">公开评论 / 视频线索</span><span class="tag tag-a" style="margin-top:10px">需官方研究权限</span></div><div style="background:#edf0ff;border-radius:11px;padding:13px"><b style="font-size:11px">LinkedIn</b><span style="display:block;color:var(--muted);font-size:9px;margin-top:6px">组织页动态 / 评论</span><span class="tag tag-b" style="margin-top:10px">组织页授权</span></div><div style="background:#e9f6f0;border-radius:11px;padding:13px"><b style="font-size:11px">WhatsApp</b><span style="display:block;color:var(--muted);font-size:9px;margin-top:6px">Business API 授权对话</span><span class="tag tag-c" style="margin-top:10px">官方账号连接</span></div></div></section><section class="panel"><div class="toolbar"><input id="researchQ" placeholder="搜索评论、公司、产品或国家" oninput="filterResearch()"/><select id="researchChannel" onchange="filterResearch()"><option>全部渠道</option><option>TikTok</option><option>LinkedIn</option><option>WhatsApp</option></select><select id="researchIntent" onchange="filterResearch()"><option>全部意向</option><option>80 分以上</option><option>60–79 分</option></select><span class="spacer"></span><button class="btn light" onclick="openResearchImport()">导入链接</button><button class="btn primary" onclick="toast('同步任务已加入队列（演示）')">同步公开内容</button></div><div id="researchList" style="display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 18px 18px">${items.map((x,i)=>`<article class="research-card" data-research="${(x.channel+' '+x.author+' '+x.region+' '+x.text+' '+x.signals.join(' ')).toLowerCase()}" data-channel="${x.channel}" data-intent="${x.intent}" style="border:1px solid var(--line);border-radius:12px;padding:14px;background:${i===0?'#fff9ee':'#fff'}"><div style="display:flex;justify-content:space-between;gap:9px;align-items:start"><div><span style="display:inline-flex;background:${colors[x.channel]};color:#fff;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800">${x.channel}</span><span style="font-size:9px;color:var(--muted);margin-left:7px">${x.type}</span></div><span class="tag ${x.intent>=80?'tag-a':x.intent>=60?'tag-b':'tag-c'}">意向 ${x.intent}</span></div><h3 style="font-size:12px;margin:12px 0 5px">${x.author} · ${x.region}</h3><p style="font-size:10px;line-height:1.6;color:#596979;margin:0 0 11px">${x.text}</p><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px">${x.signals.map(s=>`<span style="font-size:9px;color:var(--blue);background:var(--blue-soft);padding:4px 6px;border-radius:5px">${s}</span>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:9px;color:var(--muted)">${x.status} · ${x.id}</span><div style="display:flex;gap:8px"><button class="ghost" onclick="event.stopPropagation();openExternal('${x.url}')">查看原文</button><button class="btn light" onclick="event.stopPropagation();saveResearch('${x.id}')">保存为线索</button></div></div></article>`).join('')}</div></section>`;bindCommon()}
    function filterResearch(){const q=($('#researchQ')?.value||'').toLowerCase(),channel=$('#researchChannel')?.value||'全部渠道',intent=$('#researchIntent')?.value||'全部意向';$$('.research-card').forEach(card=>{const okQ=!q||card.dataset.research.includes(q),okC=channel==='全部渠道'||card.dataset.channel===channel,okI=intent==='全部意向'||(intent==='80 分以上'?Number(card.dataset.intent)>=80:Number(card.dataset.intent)>=60&&Number(card.dataset.intent)<80);card.style.display=okQ&&okC&&okI?'':'none'})}
    async function saveResearch(id){const map={'RS-001':{company:'MetalBuild public signal',person:'@metalbuildpro',country:'阿联酋',product:'地脚螺栓',source:'TikTok 公开评论'},'RS-002':{company:'Gulf Build Materials',person:'公司动态联系人',country:'阿联酋',product:'光伏紧固件',source:'LinkedIn 组织页'},'RS-003':{company:'Nordic Rail Supply',person:'Erik Larsen',country:'挪威',product:'非标连接件',source:'WhatsApp Business 授权对话'}};await mockApi.createLead(map[id]||map['RS-001']);toast('已保存为待验证线索，可在“线索中心”继续补全信息')}
    function openExternal(url){window.open(url,'_blank','noopener,noreferrer')}
    function openResearchImport(){openModal('导入公开链接',`<form id="researchImport"><div class="modal-grid"><div class="field full"><label>公开内容 URL *</label><input required name="url" placeholder="https://www.tiktok.com/..."/></div><div class="field"><label>渠道</label><select name="channel"><option>TikTok</option><option>LinkedIn</option><option>WhatsApp Business</option></select></div><div class="field"><label>备注</label><input name="note" placeholder="例如：地脚螺栓项目线索"/></div></div><div class="modal-foot"><button type="button" class="btn light" onclick="closeModal()">取消</button><button class="btn primary">加入研究池</button></div></form>`);$('#researchImport').onsubmit=e=>{e.preventDefault();closeModal();toast('链接已加入研究池，等待人工审核')}}
    setupResearchNav();$$('#nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.module));navigate('overview');
  </script>
</body>
</html>
