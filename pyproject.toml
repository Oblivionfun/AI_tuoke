[project]
name = "guanwei-workbench"
version = "0.2.0"
description = "冠维获客工作台：4 个 agent（寻客、调研、审查、文案）+ 代码编排的先查实、再出手研究工作台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "openai-agents==0.23.1",
    "pycountry>=24.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0.32",
    "tldextract>=5.1",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
workbench = "workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "SIM108"]

[tool.alembic]
script_location = "%(here)s/src/workbench/store/migrations"
prepend_sys_path = ["src"]
file_template = "%%(rev)s_%%(slug)s"
